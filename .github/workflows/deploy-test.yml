name: Deploy test

on:
  push:
    branches:
      - test

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Test SSH connection
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            mkdir -p /opt/dominoes/test/frontend
            echo "GitHub Actions reached the server" > /opt/dominoes/test/frontend/deploy-success.txt
            date >> /opt/dominoes/test/frontend/deploy-success.txt
